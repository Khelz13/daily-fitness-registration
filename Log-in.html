<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Fitness Login Test</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    width:400px;
    max-width:90%;
    background:#111;
    border:1px solid #333;
    border-radius:20px;
    padding:40px;
    text-align:center;
}

h1{
    color:#ffd000;
    font-size:34px;
}

button{
    width:100%;
    padding:18px;
    margin-top:25px;
    border:0;
    border-radius:12px;
    background:#ffd000;
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#status{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#222;
    color:#aaa;
    min-height:20px;
}

.success{
    color:#70ff70 !important;
}

.error{
    color:#ff7070 !important;
}
</style>
</head>

<body>

<div class="box">

    <h1>DAILY FITNESS</h1>

    <p>GOOGLE LOGIN TEST</p>

    <button id="googleBtn">
        🔐 SIGN IN WITH GOOGLE
    </button>

    <div id="status">
        Ready...
    </div>

</div>

<script>

console.log("STEP 1: JavaScript loaded");


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

    apiKey: "AIzaSyDGI2ZhwFbhEF40nhC-TxePjP0rNBtDMA",

    authDomain:
        "daily-fitness-8f4bb.firebaseapp.com",

    databaseURL:
        "https://daily-fitness-8f4bb-default-rtdb.firebaseio.com",

    projectId:
        "daily-fitness-8f4bb",

    storageBucket:
        "daily-fitness-8f4bb.firebasestorage.app",

    messagingSenderId:
        "27440670515",

    appId:
        "1:27440670515:web:7292f1ee2573a25fc18046"
};


console.log("STEP 2: Firebase config loaded");


/* ================================
   INITIALIZE FIREBASE
================================ */

try{

    firebase.initializeApp(firebaseConfig);

    console.log("STEP 3: Firebase initialized");

}catch(error){

    console.error("FIREBASE INIT ERROR:",error);

}


/* ================================
   AUTH
================================ */

let auth;

try{

    auth = firebase.auth();

    console.log("STEP 4: Firebase Auth ready");

}catch(error){

    console.error("AUTH ERROR:",error);

}


/* ================================
   BUTTON
================================ */

const button =
    document.getElementById("googleBtn");

const status =
    document.getElementById("status");


console.log(
    "STEP 5: Button found:",
    button
);


/* ================================
   CLICK
================================ */

button.addEventListener("click",async function(){

    console.log("STEP 6: BUTTON CLICKED");

    status.textContent =
        "Button clicked... starting Google Login.";

    status.className = "";


    try{

        const provider =
            new firebase.auth.GoogleAuthProvider();


        provider.setCustomParameters({

            prompt:"select_account"

        });


        console.log(
            "STEP 7: Starting signInWithPopup..."
        );


        status.textContent =
            "Opening Google Login...";


        const result =
            await auth.signInWithPopup(provider);


        console.log(
            "STEP 8: LOGIN SUCCESS",
            result
        );


        const user =
            result.user;


        status.textContent =
            "SUCCESS! Logged in as: " +
            user.email;


        status.className =
            "success";


        alert(
            "GOOGLE LOGIN SUCCESS!\n\n" +
            "Email: " +
            user.email +
            "\n\nUID:\n" +
            user.uid
        );

    }

    catch(error){

        console.error(
            "GOOGLE LOGIN ERROR:",
            error
        );


        status.textContent =
            "ERROR: " +
            error.code +
            "\n" +
            error.message;


        status.className =
            "error";


        alert(
            "GOOGLE LOGIN ERROR:\n\n" +
            error.code +
            "\n\n" +
            error.message
        );

    }

});

console.log(
    "STEP 9: Click handler ready"
);

</script>

</body>
</html>
