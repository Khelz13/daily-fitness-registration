<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Fitness - Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:#050505;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;

    background:#101010;

    border:1px solid #252525;

    border-radius:20px;

    padding:40px 32px;

    box-shadow:
        0 0 40px rgba(255,204,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;

    color:#ffd000;
}

.logo p{
    margin-top:6px;

    font-size:12px;
    letter-spacing:4px;

    color:#aaa;
}

.title{
    text-align:center;

    font-size:22px;
    font-weight:800;

    margin-bottom:8px;
}

.subtitle{
    text-align:center;

    color:#888;

    font-size:14px;

    margin-bottom:28px;
}

.google-btn{

    width:100%;

    border:none;

    background:#ffd000;
    color:#000;

    padding:15px;

    border-radius:12px;

    font-size:15px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.google-btn:hover{
    background:#ffe45c;
    transform:translateY(-1px);
}

.google-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:20px;

    padding:12px;

    border-radius:10px;

    font-size:13px;

    text-align:center;

    display:none;
}

.message.error{
    display:block;

    background:#351010;

    border:1px solid #7b2929;

    color:#ff8585;
}

.message.success{
    display:block;

    background:#103515;

    border:1px solid #2c7a35;

    color:#7dff8a;
}

.user-box{
    display:none;

    margin-top:25px;

    padding:15px;

    background:#181818;

    border-radius:12px;

    border:1px solid #292929;
}

.user-email{
    color:#ffd000;

    font-weight:bold;

    word-break:break-all;
}

.user-role{
    margin-top:6px;

    color:#aaa;

    font-size:13px;
}

.uid{
    margin-top:10px;

    font-size:10px;

    color:#666;

    word-break:break-all;
}

.logout-btn{

    width:100%;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    border:1px solid #333;

    background:#181818;

    color:#fff;

    cursor:pointer;
}

.logout-btn:hover{
    background:#222;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>DAILY FITNESS</h1>
        <p>STRONGER EVERY DAY</p>
    </div>

    <div class="title">
        Staff Portal
    </div>

    <div class="subtitle">
        Sign in using your authorized Google account
    </div>

    <button id="googleBtn" class="google-btn">
        🔐 SIGN IN WITH GOOGLE
    </button>

    <div id="message" class="message"></div>

    <div id="userBox" class="user-box">

        <div>
            Signed in as:
        </div>

        <div id="userEmail" class="user-email"></div>

        <div id="userRole" class="user-role"></div>

        <div id="userUid" class="uid"></div>

        <button id="logoutBtn" class="logout-btn">
            LOG OUT
        </button>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyDGI2ZhwFbhEF40nhC-TxePjP0rNBtDMA",

    authDomain:
        "daily-fitness-8f4bb.firebaseapp.com",

    databaseURL:
        "https://daily-fitness-8f4bb-default-rtdb.firebaseio.com",

    projectId:
        "daily-fitness-8f4bb",

    storageBucket:
        "daily-fitness-8f4bb.firebasestorage.app",

    messagingSenderId:
        "27440670515",

    appId:
        "1:27440670515:web:7292f1ee2573a25fc18046",

    measurementId:
        "G-SBQXSXIDML1"
};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database();


/* =====================================================
   ELEMENTS
===================================================== */

const googleBtn =
    document.getElementById("googleBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const message =
    document.getElementById("message");

const userBox =
    document.getElementById("userBox");

const userEmail =
    document.getElementById("userEmail");

const userRole =
    document.getElementById("userRole");

const userUid =
    document.getElementById("userUid");


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
    "khelzkieanasco13@gmail.com";


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

googleBtn.addEventListener("click", async function(){

    try{

        googleBtn.disabled = true;

        googleBtn.textContent =
            "SIGNING IN...";

        const provider =
            new firebase.auth.GoogleAuthProvider();

        provider.setCustomParameters({

            prompt:"select_account"

        });

        const result =
            await auth.signInWithPopup(provider);

        const user =
            result.user;

        console.log("Google User:",user);

        await checkUserRole(user);

    }

    catch(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        googleBtn.disabled = false;

        googleBtn.textContent =
            "🔐 SIGN IN WITH GOOGLE";
    }

});


/* =====================================================
   CHECK USER ROLE
===================================================== */

async function checkUserRole(user){

    try{

        const uid =
            user.uid;

        const email =
            (user.email || "").toLowerCase();


        /*
         * READ:
         * /users/<UID>
         */

        const snapshot =
            await db.ref("users/" + uid).once("value");


        const userData =
            snapshot.val();


        console.log(
            "Firebase User Data:",
            userData
        );


        /* =================================================
           NO ROLE FOUND
        ================================================= */

        if(!userData || !userData.role){

            await auth.signOut();

            showMessage(
                "ACCESS DENIED — Your Google account is not authorized for Daily Fitness.",
                "error"
            );

            googleBtn.disabled = false;

            googleBtn.textContent =
                "🔐 SIGN IN WITH GOOGLE";

            return;
        }


        const role =
            String(userData.role).toUpperCase();


        /* =================================================
           VALID ROLES
        ================================================= */

        if(
            role !== "ADMIN" &&
            role !== "STAFF"
        ){

            await auth.signOut();

            showMessage(
                "ACCESS DENIED — Invalid account role.",
                "error"
            );

            googleBtn.disabled = false;

            googleBtn.textContent =
                "🔐 SIGN IN WITH GOOGLE";

            return;
        }


        /* =================================================
           DISPLAY USER
        ================================================= */

        userEmail.textContent =
            user.email;

        userRole.textContent =
            "ROLE: " + role;

        userUid.textContent =
            "UID: " + uid;

        userBox.style.display =
            "block";

        googleBtn.style.display =
            "none";


        showMessage(
            "Login successful. Welcome to Daily Fitness!",
            "success"
        );


        /* =================================================
           SAVE SESSION
        ================================================= */

        sessionStorage.setItem(
            "dailyFitnessRole",
            role
        );

        sessionStorage.setItem(
            "dailyFitnessEmail",
            user.email || ""
        );

        sessionStorage.setItem(
            "dailyFitnessUid",
            uid
        );


        /*
         * TEMPORARY:
         * redirect after login
         */

 setTimeout(function(){

    showMessage(
        "GOOGLE LOGIN SUCCESSFUL! Your account is authenticated.",
        "success"
    );

},1000);

    catch(error){

        console.error(error);

        showMessage(
            "Unable to verify your account. " +
            error.message,
            "error"
        );

        googleBtn.disabled = false;

        googleBtn.textContent =
            "🔐 SIGN IN WITH GOOGLE";
    }

}


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener("click",async function(){

    try{

        await auth.signOut();

        sessionStorage.clear();

        location.reload();

    }

    catch(error){

        console.error(error);

    }

});


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(async function(user){

    if(!user){

        return;
    }

    console.log(
        "Already signed in:",
        user.email
    );

});

</script>

</body>
</html>
