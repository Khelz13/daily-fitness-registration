<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Fitness — Monthly Registration</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a}
.wrap{max-width:520px;margin:30px auto;padding:18px}.card{background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 25px #0001}
h1{margin:0 0 5px}.sub{color:#64748b;margin-bottom:25px}
label{display:block;font-weight:700;font-size:13px;margin:15px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;margin-top:20px}
.note{margin-top:15px;padding:12px;background:#eff6ff;border-radius:9px;color:#1e40af;font-size:13px}
.error{display:none;color:#991b1b;background:#fee2e2;padding:12px;border-radius:9px;margin-top:15px}
.success{display:none;text-align:center}.success h2{color:#166534}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🏋️ Daily Fitness</h1>
<div class="sub">Monthly Membership Registration</div>

<form id="form">
<label>Full Name</label>
<input id="name" autocomplete="name" required>

<label>Contact Number</label>
<input id="contact" type="tel" autocomplete="tel" required>

<label>Preferred Start Date</label>
<input id="startDate" type="date" required>

<div class="note">Please check your details before submitting.</div>
<button type="submit">Submit Registration</button>
<div class="error" id="error"></div>
</form>

<div class="success" id="success">
<h2>✅ Registration Submitted!</h2>
<p>Your registration has been received.</p>
<p>Please wait for the gym staff to process your membership.</p>
</div>
</div></div>

<script>
const API_KEY="dailyFitnessRegistrationRequests";

function read(){
  try{return JSON.parse(localStorage.getItem(API_KEY)||"[]")}
  catch(e){return []}
}

document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const contact=document.getElementById("contact").value.trim();
  const startDate=document.getElementById("startDate").value;
  const error=document.getElementById("error");

  const records=read();

  const duplicate=records.some(r =>
    String(r.name||"").trim().toLowerCase()===name.toLowerCase() &&
    String(r.contact||"").trim()===contact &&
    String(r.status||"PENDING").toUpperCase()!=="REJECTED"
  );

  if(duplicate){
    error.textContent="This registration already exists. Please contact the gym staff.";
    error.style.display="block";
    return;
  }

  records.push({
    id:"REG-"+Date.now(),
    name,
    contact,
    startDate,
    status:"PENDING",
    submittedAt:new Date().toISOString()
  });

  localStorage.setItem(API_KEY,JSON.stringify(records));
  document.getElementById("form").style.display="none";
  document.getElementById("success").style.display="block";
});
</script>
</body>
</html>
